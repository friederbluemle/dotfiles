name: integration
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y zsh autojump direnv fzf
      # The runner image ships /usr/share/zsh world-writable, which trips
      # compaudit during the interactive zsh startup check
      - run: sudo chmod -R go-w /usr/share/zsh
      - run: test/bootstrap.sh
